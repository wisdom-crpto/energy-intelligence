<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img"><title>山东“十五五”规划：2030年调节资源与配电网承载目标</title><rect width="100%" height="100%" fill="#0b1424" rx="18"/><text x="28" y="36" fill="#ffffff" font-size="22">山东“十五五”规划：2030年调节资源与配电网承载目标</text><text x="28" y="70" fill="#a9b7c9" font-size="14">单位：万千瓦</text><line x1="285.00" x2="285.00" y1="95" y2="450" stroke="#667085"/><text x="28" y="107" fill="#e5edf8" font-size="14">配电网可承载分布式新能源</text><rect x="285.00" y="103" width="370.00" height="26" fill="#86efac"/><text x="675" y="123" fill="#e5edf8" font-size="14">7500 [reported]</text><text x="28" y="197" fill="#e5edf8" font-size="14">新型储能装机目标</text><rect x="285.00" y="193" width="148.00" height="26" fill="#86efac"/><text x="675" y="213" fill="#e5edf8" font-size="14">3000 [reported]</text><text x="28" y="287" fill="#e5edf8" font-size="14">在运抽水蓄能装机目标</text><rect x="285.00" y="283" width="39.47" height="26" fill="#86efac"/><text x="675" y="303" fill="#e5edf8" font-size="14">800 [reported]</text><text x="28" y="377" fill="#e5edf8" font-size="14">虚拟电厂可调容量目标</text><rect x="285.00" y="373" width="19.73" height="26" fill="#86efac"/><text x="675" y="393" fill="#e5edf8" font-size="14">400 [reported]</text><text x="28" y="477" fill="#a9b7c9" font-size="12">actual 实际 · reported 来源披露 · estimate 估计 · forecast 预测；来源见正文</text></svg>